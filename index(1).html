<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Super Yohann Land</title>
<style>
:root{color-scheme:dark;--bg:#111;--fg:#fff;--btn:#e52521;--panel:#1c1c2e}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
body{display:flex;flex-direction:column;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#c{flex:1;min-height:0;width:100%;object-fit:contain;background:#000}
#pad{display:flex;justify-content:space-between;align-items:center;padding:10px 8px;gap:10px}
#pad div{display:flex;gap:4px}
.b{width:18vmin;max-width:132px;height:16.8vmin;max-height:96px;border-radius:16px;border:0;background:var(--btn);color:#fff;font-size:30px;font-weight:700;opacity:.85;touch-action:none}
.b:active,.b.p{opacity:1;transform:scale(.95)}
.b.off{filter:grayscale(1);opacity:.35}#bf{background:#ff8c1a}
@media (orientation:landscape){body{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}#pad{position:absolute;left:0;right:0;bottom:0;padding:0 14px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}.b{width:21.6vh;height:21.6vh;max-width:none;max-height:none;opacity:.5}}
#muteBtn{right:58px!important}
#menuBtn,#muteBtn{position:absolute;top:calc(env(safe-area-inset-top,0px) + 6px);right:8px;background:#0008;color:#fff;border:0;border-radius:8px;font-size:18px;padding:4px 10px}
#menu{position:absolute;inset:0;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;overflow:auto;touch-action:pan-y;gap:12px;padding:16px;box-sizing:border-box;text-align:center}
#menu h1{margin:0;font-size:26px;color:#fbd000}
#grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;width:100%;max-width:560px}
#grid button{padding:9px 0;font-size:14px;font-weight:700;border-radius:10px;border:0;background:#43b047;color:#fff}
#grid button:disabled{background:#444;color:#888}
#grid button.d{background:#fbd000;color:#222}
#menu>h1{margin-top:auto}#menu>.sm{margin-bottom:auto}
.big{background:var(--btn);color:#fff;border:0;border-radius:12px;padding:14px 28px;font-size:18px;font-weight:700}
.sm{background:none;color:#aaa;border:0;font-size:13px;text-decoration:underline}
</style></head><body>
